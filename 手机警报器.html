<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>手机警报器</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080b10;color:#edf3fc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#17202a 0,#080b10 45%);padding:12px 10px max(16px,env(safe-area-inset-bottom))}
    .app{max-width:460px;margin:auto;border:1px solid #303844;border-radius:14px;overflow:hidden;background:#0d1117;box-shadow:0 18px 55px #000a}
    .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px;background:#050608;border-bottom:1px solid #242a32;height:31px}
    .lamp{border-radius:2px;background:#1a2028;box-shadow:inset 0 0 0 1px #2a323e;transition:background .08s,box-shadow .08s}
    .lamp.blue.on{background:#087cff;box-shadow:0 0 15px 4px #087cff,inset 0 0 8px #a6d5ff}
    .lamp.white.on{background:#fff;box-shadow:0 0 15px 4px #fff}
    .lamp.amber.on{background:#ff941c;box-shadow:0 0 15px 4px #ff941c}
    .lamp.red.on{background:#ff1839;box-shadow:0 0 15px 4px #ff1839}
    header{height:37px;background:linear-gradient(#242a32,#141a22);display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.18em;font-size:14px;text-shadow:0 1px 3px #000}
    .status{padding:8px 10px 4px;color:#8391a2;font-size:10px;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
    .dot{width:6px;height:6px;border-radius:50%;background:#f59722;box-shadow:0 0 6px #f59722}
    .status strong{margin-left:auto;letter-spacing:0;color:#d9e4f2;font-size:11px}
    main{padding:0 8px 10px}
    section{margin-top:8px}
    h2{font-size:10px;font-weight:600;color:#768292;margin:0 0 5px;padding-left:8px;border-left:2px solid #d98220;letter-spacing:.12em}
    .grid{display:grid;gap:5px}
    .two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.five{grid-template-columns:repeat(5,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    button{touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;color:#d9e7f6;min-width:0;border:1px solid #303945;border-radius:5px;background:linear-gradient(#202733,#141922);box-shadow:inset 0 1px #ffffff13,0 2px 3px #0008;min-height:46px;padding:5px 3px;font:700 12px system-ui,-apple-system,"PingFang SC",sans-serif;line-height:1.15}
    button small{display:block;font-size:8px;font-weight:500;opacity:.62;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button:active{transform:translateY(1px)}
    button[aria-pressed="true"]{border-color:#2a9dff;background:linear-gradient(#075696,#082e55);box-shadow:0 0 11px #078aff88,inset 0 0 9px #64b9ff44;color:#fff}
    .red{color:#ff8e9c;background:linear-gradient(#3b171d,#211114);border-color:#593037}.red[aria-pressed="true"]{background:linear-gradient(#ba1c31,#641220);border-color:#ff4663;box-shadow:0 0 12px #e51638a0}
    .green{color:#76efa1;background:linear-gradient(#183529,#12251c);border-color:#28523a}.green[aria-pressed="true"]{background:linear-gradient(#05864a,#06482c);border-color:#22e886;box-shadow:0 0 11px #15d4788a}
    .orange{color:#ffd38c;background:linear-gradient(#322419,#1d1711);border-color:#56402a}.orange[aria-pressed="true"]{background:linear-gradient(#e99620,#a1540a);border-color:#ffd474;color:#150e05;box-shadow:0 0 13px #ffa52299}
    .purple{color:#dab0ff;background:linear-gradient(#291c38,#191524);border-color:#443354}.purple[aria-pressed="true"]{background:linear-gradient(#7621c7,#41106f);border-color:#b75cff;box-shadow:0 0 11px #9325e4aa;color:#fff}
    .cyan{color:#7ddff0;background:linear-gradient(#173139,#132127);border-color:#2a4750}.cyan[aria-pressed="true"]{background:linear-gradient(#117e97,#0a4756);border-color:#5ee9ff}
    .five button{min-height:42px;font-size:10px}.four button{min-height:43px;font-size:10px}
    .broadcast{display:none;margin-top:6px;gap:5px}.broadcast.show{display:flex}.broadcast input{flex:1;min-width:0;background:#080c11;border:1px solid #34404d;border-radius:5px;color:#fff;padding:9px;font-size:13px}.broadcast button{width:78px;min-height:39px}
    .volume{display:flex;align-items:center;gap:10px;padding:9px 2px 0;color:#97a5b6;font-size:11px}.volume input{flex:1;accent-color:#ed951d}.soundcheck{width:100%;margin-top:8px;min-height:38px;color:#91d5ff}.audio-status{font-size:10px;color:#94a4b6;text-align:center;padding-top:5px;min-height:18px}
    footer{border-top:1px solid #242b33;padding:8px 10px;color:#687482;font-size:9px;display:flex;justify-content:space-between;gap:10px}footer strong{color:#e76577;font-weight:500}
    .help{max-width:460px;margin:12px auto 0;color:#8e9caa;font-size:11px;line-height:1.6;text-align:center}
    @media(max-width:360px){.five button,.four button{font-size:9px}button{font-size:11px}}
  </style>
</head>
<body>
<div class="app">
  <div class="bar" id="bar" aria-label="模拟警灯"><span class="lamp blue"></span><span class="lamp blue"></span><span class="lamp blue"></span><span class="lamp amber"></span><span class="lamp white"></span><span class="lamp white"></span><span class="lamp amber"></span><span class="lamp red"></span><span class="lamp red"></span><span class="lamp red"></span></div>
  <header>手机警报器</header>
  <div class="status"><span class="dot"></span>系统就绪 <strong id="state">待命</strong></div>
  <main>
    <section><h2>号角与广播</h2><div class="grid two">
      <button class="red" data-hold="horn">气笛号角<small>按住发声</small></button>
      <button class="green" id="broadcastToggle" aria-pressed="false">车外广播<small>文字转语音</small></button>
    </div><div class="broadcast" id="broadcast"><input id="speechText" aria-label="广播内容" placeholder="输入要广播的话" maxlength="120"><button class="green" id="speak">播放</button></div></section>
    <section><h2>追光警灯</h2><div class="grid five" id="lights">
      <button class="orange" data-light="auto">自动联动<small>随警笛</small></button><button data-light="1">模式 1<small>双闪</small></button><button data-light="2">模式 2<small>交替</small></button><button data-light="3">模式 3<small>大爆闪</small></button><button data-light="off">关闭警灯<small>停止闪灯</small></button>
    </div></section>
    <section><h2>手动电笛</h2><div class="grid two"><button class="orange" data-hold="high">高音电笛<small>长按提升 / 松开停止</small></button><button class="orange" data-hold="low">低音电笛<small>长按提升 / 松开停止</small></button></div></section>
    <section><h2>巡航警笛</h2><div class="grid three" id="sirens"><button data-siren="wail">巡航 Wail<small>缓慢</small></button><button data-siren="slow">慢速 Wail<small>低速</small></button><button data-siren="fast">快速 Wail<small>快速</small></button><button data-siren="yelp">急促 Yelp<small>高频</small></button><button data-siren="piercer">追击变频<small>追击</small></button><button data-siren="phaser">极速穿透<small>极速</small></button><button data-siren="battle">战术颤音<small>双频脉冲</small></button><button data-siren="hilo">救护 Hi-Lo<small>高低交替</small></button><button class="cyan" data-siren="auto">自动<small>循环切换</small></button></div></section>
    <section><h2>双路开关</h2><div class="grid two"><button class="purple" data-channel="a" aria-pressed="false">开关 A<small>警笛 + 警灯</small></button><button class="purple" data-channel="b" aria-pressed="false">开关 B<small>警笛 + 警灯</small></button></div></section>
    <section><h2>系统控制</h2><div class="grid four"><button class="orange" id="bass" aria-pressed="false">重低音脉冲<small>叠加低音</small></button><button id="settings">系统设置<small>屏幕常亮</small></button><button id="quiet" aria-pressed="false">低功率<small>降低音量</small></button><button class="red" id="mute">静音<small>一键停止</small></button></div><label class="volume">音量 <input id="volume" type="range" min="0" max="100" value="80"> <span id="volumeValue">80%</span></label><button class="soundcheck" id="soundcheck">🔊 测试声音</button><div class="audio-status" id="audioStatus" role="status">点按“测试声音”检查播放 · 首次加载约 1 秒</div></section>
  </main>
  <footer><span>v3.0.0 · 真实警笛音源</span><strong>娱乐模拟 · 请勿在公共场所干扰他人</strong></footer>
</div>
<p class="help">首次点按后浏览器才允许播放声音。按住气笛或电笛发声，松开即停；再次点按已选警笛可停止。</p>

  function stopBass(){if(!bassOsc)return;try{bassOsc.stop()}catch{}bassOsc=null;bassGain=null;$('#bass').setAttribute('aria-pressed','false')}
  function toggleBass(){if(bassOsc){stopBass();return}setup();bassOsc=ctx.createOscillator();bassGain=ctx.createGain();bassOsc.type='sine';bassOsc.frequency.value=110;bassGain.gain.value=.09;bassOsc.connect(bassGain).connect(master);bassOsc.start();$('#bass').setAttribute('aria-pressed','true')}
  function setLight(mode){lightMode=mode;clearInterval(lightTimer);lamps.forEach(l=>l.classList.remove('on'));if(mode!=='off'){const flash=()=>{tick++;lamps.forEach((l,i)=>{let on;if(mode==='1')on=tick%2?i<5:i>=5;else if(mode==='2')on=tick%4<2?i<3||i>6:i>=3&&i<=6;else if(mode==='3')on=tick%5!==4&&i%2===tick%2;else on=tick%6<3?i<5:i>=5;l.classList.toggle('on',on)})};flash();lightTimer=setInterval(flash,mode==='3'?90:180)}refresh()}
  function refresh(){const title=hold?'手动发声':activeChannel?'并发 '+activeChannel.toUpperCase():activeMode?labels[activeMode]:'待命';$('#state').textContent=title;$$('[data-siren]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.siren===activeMode));$$('[data-channel]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.channel===activeChannel));$$('[data-light]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.light===lightMode))}
  function stopAll(){++playSerial;endHold();clearTrackTimers();clearTracks();stopBass();activeMode=null;activeChannel=null;setLight('off');window.speechSynthesis?.cancel();status('已停止');refresh()}
  $$('[data-siren]').forEach(b=>b.addEventListener('click',()=>playMode(activeMode===b.dataset.siren?null:b.dataset.siren)));
  $$('[data-channel]').forEach(b=>b.addEventListener('click',()=>{if(activeChannel===b.dataset.channel)stopAll();else playCombo(b.dataset.channel)}));
  $$('[data-light]').forEach(b=>b.addEventListener('click',()=>setLight(b.dataset.light)));
  $$('[data-hold]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startHold(b.dataset.hold);b.setAttribute('aria-pressed','true')});for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>{endHold();b.setAttribute('aria-pressed','false')})});
  $('#bass').addEventListener('click',toggleBass);
  $('#quiet').addEventListener('click',()=>{lowPower=!lowPower;$('#quiet').setAttribute('aria-pressed',lowPower);volume()});
  $('#volume').addEventListener('input',volume);$('#mute').addEventListener('click',stopAll);
  $('#soundcheck').addEventListener('click',()=>{stopAll();playMode('wail');setTimeout(()=>{if(activeMode==='wail')stopAll()},2000)});
  $('#broadcastToggle').addEventListener('click',()=>{const show=$('#broadcast').classList.toggle('show');$('#broadcastToggle').setAttribute('aria-pressed',show);if(show)$('#speechText').focus()});
  $('#speak').addEventListener('click',()=>{const s=$('#speechText').value.trim();if(!s)return;if(!('speechSynthesis'in window)){status('浏览器不支持文字广播');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.volume=+$('#volume').value/100;speechSynthesis.speak(u)});
  $('#settings').addEventListener('click',async()=>{if(!navigator.wakeLock){status('此浏览器不支持屏幕常亮');return}try{if($('#settings').getAttribute('aria-pressed')==='true'){$('#settings').setAttribute('aria-pressed','false');await wakeLock?.release();wakeLock=null}else{wakeLock=await navigator.wakeLock.request('screen');$('#settings').setAttribute('aria-pressed','true')}}catch{status('此环境无法启用屏幕常亮')}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});refresh();volume();
})();

</script>
</body>
